services:
  docs:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm ci
        exec npm run docs:dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Identifiants DocSearch (ALGOLIA_APP_ID, ALGOLIA_API_KEY, ALGOLIA_INDEX_NAME)
      # livrés par la plateforme. Facultatif : sans eux, la recherche locale de
      # VitePress prend le relais.
      - path: /run/base44/app.env
        required: false
    volumes:
      - ./:/app
      - docs_node_modules:/app/node_modules
    healthcheck:
      # VitePress sert une page dès que le serveur de développement est prêt.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure
    labels:
      base44.project: "Documentation OpenBastion"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  docs_node_modules:
