openapi: 3.1.0
info:
  title: OpenBastion REST API
  version: "0.1.0-mvp"
  summary: API publique OpenBastion — périmètre MVP
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
  description: >
    API REST de la plateforme PAM OpenBastion. Ce document ne couvre que le
    périmètre MVP (voir docs/roadmap.md). Les endpoints liés aux
    protocoles hors SSH, au Workflow Service et au MFA Service natif seront
    ajoutés en v0.0.1 sans rupture de compatibilité sur ce préfixe /v1.

servers:
  - url: "https://{host}/api/v1"
    variables:
      host:
        default: bastion.example.com

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: sessions
  - name: vault
  - name: policies
  - name: audit

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Authentifie un opérateur (identité locale ou fédérée OIDC)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: >
            Identifiants invalides — ou, quand le mot de passe est bon et qu'un rôle
            du compte exige le second facteur (ADR-0062), le défi à présenter à
            `/auth/mfa/verify` (ou `/auth/mfa/enroll`) : un client qui ne connaît
            pas le second facteur voit un refus, jamais un jeton.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/MFAChallenge" }
        "429":
          description: >
            Trop de tentatives de connexion depuis la même adresse de client
            (ADR-0015) : par défaut une rafale de 5 puis une par minute
            (`CLIENT_LOGIN_BURST`, `CLIENT_LOGIN_RATE_PER_MINUTE`). La demande
            n'atteint pas l'Authentication Service. Le corps est un texte
            (« too many login attempts »), pas l'enveloppe `Error`.
          headers:
            Retry-After:
              description: Secondes à attendre avant qu'une tentative soit de nouveau acceptée.
              schema: { type: integer, minimum: 1 }
          content:
            text/plain:
              schema: { type: string }

  /auth/oidc:
    get:
      tags: [auth]
      summary: Les fournisseurs OIDC déclarés (ADR-0076)
      description: >
        Pour la page de connexion : l'identifiant et le libellé de chaque
        fournisseur, dans l'ordre déclaré, jamais son émetteur. L'identifiant
        vide est celui des variables `OIDC_*`. Publique ; la Gateway garde la
        réponse 30 s.
      security: []
      responses:
        "200":
          description: La liste, vide si la connexion fédérée est désactivée
          content:
            application/json:
              schema:
                type: object
                required: [enabled, providers]
                properties:
                  enabled: { type: boolean }
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityProviderInfo" }
        "502": { description: L'Authentication Service ne répond pas }

  /auth/oidc/start:
    post:
      tags: [auth]
      summary: Commence une connexion fédérée OIDC (ADR-0035, ADR-0076)
      description: >
        Rend l'URL du fournisseur où envoyer le navigateur : flux par code
        d'autorisation avec PKCE (S256), `state` et `nonce` tirés au hasard,
        valables 10 minutes et à usage unique. La tentative retient son
        fournisseur : le retour ne s'échange que chez lui. Corps facultatif avec
        un seul fournisseur ; `provider` obligatoire dès qu'il y en a plusieurs.
        Compte dans le budget de connexion par adresse, comme `/auth/login`.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string, pattern: "^[a-z0-9-]{1,32}$", description: "L'identifiant d'une entrée de `GET /auth/oidc`" }
      responses:
        "200":
          description: L'URL d'autorisation
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string, format: uri }
        "400": { description: Plusieurs fournisseurs et aucun nommé, ou un identifiant inconnu }
        "404": { description: La connexion fédérée n'est pas configurée }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }

  /auth/oidc/callback:
    post:
      tags: [auth]
      summary: Termine une connexion fédérée OIDC (ADR-0035)
      description: >
        Le client renvoie le `code` et le `state` que le fournisseur a ajoutés à
        l'URL de retour. Le jeton d'identité est vérifié champ par champ ; les
        rôles viennent de la table des groupes déclarée (`OIDC_ROLE_MAP_FILE`),
        jamais du fournisseur. Le compte s'appelle `oidc:<sub>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "200":
          description: Le jeton OpenBastion, comme `/auth/login`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: Connexion refusée (état inconnu ou déjà utilisé, code refusé, jeton d'identité invalide) — sans détail }
        "403": { description: L'identité est authentique, et aucun de ses groupes ne donne de rôle OpenBastion }
        "404": { description: La connexion fédérée n'est pas configurée }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }
        "503": { description: Le fournisseur ou la base ne répond pas — la cause reste dans le journal }

  /auth/ldap:
    get:
      tags: [auth]
      summary: Dit si la connexion par annuaire est activée, et par quels annuaires (ADR-0061, ADR-0076)
      description: >
        Pour la page de connexion : l'identifiant et le libellé de chaque
        annuaire, jamais son URL ni sa base. L'identifiant vide est celui des
        variables `LDAP_*`. Publique ; la Gateway garde la réponse 30 s.
      security: []
      responses:
        "200":
          description: Activée ou non, et la liste
          content:
            application/json:
              schema:
                type: object
                required: [enabled, directories]
                properties:
                  enabled: { type: boolean }
                  directories:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityProviderInfo" }
        "502": { description: L'Authentication Service ne répond pas }

  /auth/ldap/login:
    post:
      tags: [auth]
      summary: Connexion avec le mot de passe de l'annuaire, LDAP ou Active Directory (ADR-0061)
      description: >
        Le corps de `/auth/login`, plus `directory` : l'identifiant de l'annuaire
        choisi, obligatoire dès qu'il y en a plusieurs (ADR-0076) ; OpenBastion
        n'essaie jamais les annuaires l'un après l'autre. L'annuaire vérifie le mot
        de passe (un compte de service cherche l'utilisateur, une connexion à part
        se lie en son nom) ; les rôles viennent de la table des groupes de cet
        annuaire, jamais de l'annuaire lui-même. Le compte s'appelle
        `ldap:<annuaire>:<objectGUID ou entryUUID>`, ou `ldap:<…>` pour l'annuaire
        des variables `LDAP_*`.
        Un mot de passe vide est refusé avant l'annuaire (ce serait un bind anonyme).
        Compte dans le budget de connexion par adresse, comme `/auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/LoginRequest" }
                - type: object
                  properties:
                    directory: { type: string, pattern: "^[a-z0-9-]{1,32}$", description: "L'identifiant d'une entrée de `GET /auth/ldap`" }
      responses:
        "200":
          description: Le jeton OpenBastion, comme `/auth/login`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { description: "Le corps n'est pas une connexion ; ou plusieurs annuaires et aucun nommé, ou un identifiant inconnu — aucun annuaire n'est interrogé" }
        "401": { description: Connexion refusée (nom inconnu, plusieurs entrées, mot de passe faux ou vide, compte désactivé) — sans détail }
        "403": { description: L'annuaire répond de l'utilisateur, et aucun de ses groupes ne donne de rôle OpenBastion }
        "404": { description: La connexion par annuaire n'est pas configurée }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }
        "503": { description: L'annuaire ne répond pas, refuse le compte de service, ou son certificat n'est pas reconnu — la cause reste dans le journal ; jamais de repli sur un compte local }

  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Termine une connexion par le code du second facteur (ADR-0062)
      description: >
        Le code à 6 chiffres de l'application d'authentification, ±30 s, à usage
        unique. Le défi vaut 5 minutes et 5 essais. Compte dans le budget de
        connexion par adresse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACodeRequest" }
      responses:
        "200":
          description: Le jeton OpenBastion, comme `/auth/login`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: Défi inconnu, expiré ou épuisé, code faux ou déjà utilisé — sans détail }
        "404": { description: Le second facteur n'est pas configuré }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }
        "503": { description: Le secret ne s'ouvre pas (clé changée) ou la base ne répond pas }

  /auth/mfa/enroll:
    post:
      tags: [auth]
      summary: Donne le secret TOTP d'un compte qui n'en a pas, contre le code d'enrôlement d'un administrateur (ADR-0062)
      description: >
        Le défi d'un `enrollment_required` et le code émis par
        `openbastion-cli mfa enrollment-code` pour ce compte. Le secret est rendu
        une fois (`Cache-Control: no-store`) et n'est actif qu'après
        `/auth/mfa/enroll/confirm`. Une fois par défi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, enrollmentCode]
              properties:
                challenge: { type: string }
                enrollmentCode: { type: string }
                factor: { type: string, enum: [totp, webauthn], default: totp, description: "ADR-0065 : webauthn rend les options de navigator.credentials.create" }
      responses:
        "200":
          description: Le secret, à recopier dans l'application d'authentification
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "TOTP : base32, sans remplissage" }
                  otpauthUri: { type: string }
                  webauthn: { type: object, description: "WebAuthn : les options de navigator.credentials.create" }
        "401": { description: Défi inconnu, expiré, épuisé ou d'un compte déjà enrôlé ; code d'enrôlement faux, d'un autre compte, remplacé ou expiré }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }

  /auth/mfa/enroll/confirm:
    post:
      tags: [auth]
      summary: Active le secret par un premier code, brûle le code d'enrôlement et termine la connexion (ADR-0062)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACodeRequest" }
      responses:
        "200":
          description: Le jeton OpenBastion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: Défi inconnu, expiré ou épuisé ; code faux ; code d'enrôlement utilisé ou remplacé entre-temps }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }

  /auth/mfa/webauthn/verify:
    post:
      tags: [auth]
      summary: Termine une connexion par une clé de sécurité (ADR-0065)
      description: >
        La réponse de `navigator.credentials.get` aux options du défi, telle que le
        navigateur la donne. Vérifiés : l'origine (dans `WEBAUTHN_ORIGINS`), le `rpId`,
        la présence de l'utilisateur, le défi, la signature par une clé du compte ;
        une clé dont le compteur recule est refusée. Seul facteur admis pour un rôle
        strict. Compte dans le budget de connexion par adresse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, credential]
              properties:
                challenge: { type: string }
                credential: { type: object, description: "PublicKeyCredential en JSON (base64url)" }
      responses:
        "200":
          description: Le jeton OpenBastion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { description: "credential n'est pas un objet" }
        "401": { description: Défi inconnu, expiré ou épuisé ; origine, rpId ou signature refusés ; clé d'un autre compte ; compteur qui recule }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }

  /auth/mfa/webauthn/keys/add:
    post:
      tags: [auth]
      summary: Commence l'ajout d'une clé de secours, avec la signature de la clé actuelle et un code d'administrateur (ADR-0066)
      description: >
        Sur le défi d'une connexion qui admet `webauthn` : `credential` est la signature
        de la clé actuelle (vérifiée comme à `/auth/mfa/webauthn/verify`), `enrollmentCode`
        un code émis par `openbastion-cli mfa enrollment-code` pour ce compte. Les deux
        vérifiés, le défi devient l'enregistrement d'une clé (une fois ; il ne connecte
        plus) et la réponse porte les options de création ; `/auth/mfa/webauthn/enroll/confirm`
        termine. 5 clés au plus. Compte dans le budget de connexion par adresse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, credential, enrollmentCode]
              properties:
                challenge: { type: string }
                credential: { type: object }
                enrollmentCode: { type: string }
      responses:
        "200":
          description: Les options de navigator.credentials.create, la clé actuelle exclue
          content:
            application/json:
              schema:
                type: object
                properties:
                  webauthn: { type: object }
        "400": { description: "credential n'est pas un objet" }
        "401": { description: Signature refusée (origine, rpId, clé d'un autre compte, compteur qui recule), code d'enrôlement faux ou d'un autre compte, déjà 5 clés, défi déjà converti — sans détail }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }

  /auth/mfa/webauthn/enroll/confirm:
    post:
      tags: [auth]
      summary: Enregistre la clé de sécurité créée par le navigateur, brûle le code d'enrôlement et termine la connexion (ADR-0065)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, credential]
              properties:
                challenge: { type: string }
                credential: { type: object, description: "La réponse de navigator.credentials.create, en JSON (base64url)" }
      responses:
        "200":
          description: Le jeton OpenBastion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { description: "credential n'est pas un objet" }
        "401": { description: Défi inconnu, expiré ou épuisé ; attestation refusée ; code d'enrôlement utilisé ou remplacé entre-temps }
        "429": { description: Budget de connexion de l'adresse épuisé (`Retry-After`) }

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: Renouvelle un access token à partir d'un refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nouveau couple de jetons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }

  /auth/me:
    get:
      tags: [auth]
      summary: Identité de l'opérateur authentifié
      responses:
        "200":
          description: Profil courant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /sessions:
    get:
      tags: [sessions]
      summary: Liste les demandes break-glass en attente que l'appelant peut décider (ADR-0012)
      description: >
        **Un seul statut est servi : `status=pending_approval`.** Sans `status`,
        ou avec un autre statut : `400` (servir « les siennes » et « toutes pour
        un administrateur » exige un modèle de visibilité que le RBAC actuel ne
        sait pas exprimer ; ce n'est pas encore fait).

        La liste est celle de **ce que l'appelant pourrait approuver maintenant**
        — pas de ce qui existe : demandes en attente et non périmées, dont il
        n'est pas l'auteur, pour un compte que couvre sa politique
        `breakglass-approve:account:{id}`, tant que le break-glass est activé et
        que la durée demandée tient dans la limite d'aujourd'hui. Qui n'a
        aucune autorité reçoit une liste **vide** en `200`, jamais `403` : la
        réponse ne dit pas s'il existe des demandes. Les plus proches de leur
        échéance viennent en premier.

        Le Broker lit au plus 100 demandes en attente ; s'il y en avait
        davantage, la réponse porte `truncated: true`. La pagination porte sur
        la liste déjà filtrée.

        L'identité de l'appelant et ses rôles viennent du jeton vérifié par le
        Gateway ; rien de ce que le client écrit à ce sujet n'est relayé.

        **Chaque demande de la page servie est un événement d'audit**
        `session.listed` (succès, ressource `session`, l'identifiant de la
        demande, auteur = l'utilisateur authentifié), écrit **avant** que la
        page soit servie ; si l'un d'eux ne s'écrit pas, la page n'est pas
        servie (503) — ADR-0023. Pas de budget : chaque liste servie écrit à
        nouveau. Une page vide n'écrit rien et ne dépend pas de l'audit.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [pending_approval] }
      responses:
        "200":
          description: Page de demandes en attente (éventuellement vide)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Session" }
                      truncated:
                        type: boolean
                        description: >
                          Présent, et vrai, seulement si la lecture a été coupée
                          à 100 demandes en attente : il y en avait d'autres.
        "400":
          description: "`status` absent, ou autre que `pending_approval`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Appelant non identifié.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Une dépendance (Authorization Service, magasin, ou l'audit où la
            page doit être enregistrée — ADR-0023) ne répond pas. Corps
            générique ; la cause est dans le journal du Broker. **Jamais de liste
            partielle** : une demande qui manquerait sans que l'on le dise ferait
            croire à l'approbateur qu'il n'y a rien à décider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [sessions]
      summary: Demande une nouvelle session privilégiée
      description: >
        Par défaut, l'octroi d'une session ordinaire est immédiat après
        vérification RBAC. Si le compte exige une approbation (ADR-0067), le
        demandeur fournit `ticket` : la demande attend une autre personne,
        titulaire d'une politique sur `session-approve:account:{id}`. Le ticket
        suit `APPROVAL_TICKET_PATTERN` et reste une référence, jamais un secret.
        Il figure dans les événements d'audit de demande et de décision,
        protégés par le hash v4 (ADR-0068). Une demande `breakGlass` garde ses
        propres règles d'approbation (ADR-0011).

        Avec `breakGlass: true`, la session peut s'exécuter alors que le
        Command Recorder est indisponible (ADR-0009) — une dérogation à
        l'enregistrement, et rien d'autre : authentification, RBAC
        `session:create`, Vault et audit sont inchangés. Elle exige, en plus,
        une justification d'au moins 10 caractères, une durée comprise entre
        1 et la limite de la plateforme (`BREAKGLASS_MAX_MINUTES`) et une
        politique RBAC sur la ressource `breakglass:account:{targetAccountId}`
        — refusé par défaut, y compris pour un administrateur. Désactivé tant
        que la plateforme n'a pas fixé cette limite. Chaque demande, accordée
        ou refusée, est auditée (`session.breakglass_requested`).

        **Jamais pour un écran (ADR-0071 §8).** L'enregistrement d'une session
        `rdp` ou `vnc` ne se déroge pas : une demande `breakGlass` sur un tel
        compte est refusée dès sa création (`409`), enregistrée comme refusée et
        auditée (`session.breakglass_requested`, échec), avant qu'aucune
        approbation ne soit demandée.

        **Double validation (ADR-0011).** Par défaut
        (`BREAKGLASS_APPROVAL=required`), une demande `breakGlass` qui remplit
        ces conditions n'est **pas accordée** : elle est créée au statut
        `pending_approval`, avec une échéance de décision
        (`expiresAt`, `BREAKGLASS_APPROVAL_WINDOW_MINUTES`, 15 par défaut).
        Une autre personne l'approuve ou la rejette
        (`/sessions/{sessionId}/approve`, `/reject`). Tant qu'elle attend, elle
        n'est pas une session : `connect` répond `409`, aucun scope n'est
        consommé.

        Les approbateurs la trouvent par `GET /sessions?status=pending_approval`
        (ADR-0012). Si la plateforme a un canal de notification
        (`BREAKGLASS_NOTIFY_URL`, un webhook), il est prévenu — au mieux,
        après coup, sans effet sur la demande ni sur son code de retour. Ce
        webhook n'est pas une route de cette API : il sort du maillage ; son
        message ne porte ni la justification ni rien de la cible.

        **Plafond par demandeur (ADR-0013).** Un même demandeur ne peut pas
        avoir plus de `BREAKGLASS_MAX_PENDING_PER_REQUESTER` demandes en
        attente (3 par défaut, de 1 à 100) : au-delà, la demande est refusée
        (`429`), auditée (`session.breakglass_requested`, `success=false`),
        non notifiée, et absente de la liste. Le plafond est celui de chaque
        demandeur — le sien n'ôte rien à un autre — et une place se libère
        quand une demande est décidée ou arrive à son échéance. Il ne
        s'applique que si l'approbation est requise.

        **Débit par utilisateur (ADR-0014).** Avant tout, le Gateway limite
        les `POST /sessions` de **chaque utilisateur vérifié** (seau à jetons :
        `SESSION_REQUEST_BURST` d'un coup, de 1 à 1000, défaut 10, puis
        `SESSION_REQUEST_RATE_PER_MINUTE` par minute, de 1 à 600, défaut 6).
        Chaque tentative compte, acceptée ou non, y compris celle dont le corps
        est illisible ; une demande refusée ici n'atteint pas le Broker : ni
        ligne, ni événement d'audit. La limite est par processus du Gateway.

        **Signature du webhook (ADR-0013).** Si `BREAKGLASS_NOTIFY_SECRET`
        est fixé (32 octets au moins), chaque envoi porte
        `X-OpenBastion-Timestamp` (secondes Unix, à l'instant de l'envoi) et
        `X-OpenBastion-Signature: v1=<hex>`, où `<hex>` est
        `HMAC-SHA256(secret, timestamp + "." + corps exact)`. Le récepteur
        recalcule, compare en temps constant et refuse un horodatage hors de
        sa tolérance. Cela prouve l'origine, l'intégrité et la fraîcheur du
        message — pas sa confidentialité, et pas l'absence de rejeu dans la
        tolérance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRequest" }
      responses:
        "201":
          description: >
            Session créée (`active`) — ou demande enregistrée au statut
            `pending_approval` si le compte ou la politique break-glass demande
            une approbation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403":
          description: >
            Refusé par l'Authorization Service — ou, pour une demande
            `breakGlass`, parce que l'une de ses conditions n'est pas remplie
            (désactivé, identifiant de compte qui n'en est pas un —
            `^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$`, ADR-0012 —, justification
            trop courte, durée hors limite, aucune politique sur
            `breakglass:account:*`). Le corps dit laquelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Le ticket manque, n'est pas une chaîne, ou ne respecte pas le format déclaré pour une demande d'approbation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Le Vault n'a pas ce compte privilégié (ADR-0043) — vérifié après la décision d'accès, jamais avant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Le compte privilégié n'a pas de clé d'hôte épinglée (ADR-0039) — aucune session ne pourrait s'y ouvrir ; la demande est refusée et auditée (ADR-0043).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Deux causes distinctes, que le corps distingue.
            (1) **Débit** (ADR-0014) : « too many session requests from this
            user (at most N at once, then one every X): retry in S s » ; la
            réponse porte `Retry-After` (secondes, arrondies au-dessus, au
            moins 1) ; la demande n'a pas atteint le Broker et n'est ni
            enregistrée ni auditée ; réessayer après le délai.
            (2) **Plafond** : demande `breakGlass` refusée parce que son
            demandeur a déjà le nombre maximal de demandes en attente d'une
            décision (`BREAKGLASS_MAX_PENDING_PER_REQUESTER`, ADR-0013). Le
            corps dit le plafond, il n'y a pas de `Retry-After` ; la demande
            est enregistrée comme refusée et auditée. Réessayer n'a de sens
            qu'une fois une demande décidée ou échue.
          headers:
            Retry-After:
              description: >
                Présent seulement pour la cause (1) : secondes à attendre
                avant qu'un jeton se reforme.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Une dépendance ne répond pas — par exemple, les demandes en
            attente du demandeur n'ont pas pu être comptées : la demande n'est
            pas acceptée (jamais acceptée « au cas où »). Le corps ne dit pas
            la cause ; elle est dans le journal du Broker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/search:
    get:
      tags: [sessions]
      summary: Cherche des sessions par leurs métadonnées (ADR-0080)
      description: >
        Les sessions créées dans la fenêtre, les plus récentes d'abord, dont
        le demandeur, le compte, la justification ou le ticket contient `q`
        (sous-chaîne sans casse, sans joker : `%` et `_` sont eux-mêmes ;
        `q` absent : toutes celles de la fenêtre), parmi celles que
        l'appelant peut lire — les siennes, celles qu'il a décidées, et
        celles d'un compte où il détient `session:read` sur
        `session-read:account:{id}` (ADR-0021). Chaque session servie au
        titre d'une politique est un événement `session.read`, écrit
        **avant** la réponse ; un seul non écrit : rien n'est servi (503).
        50 sessions par page ; une page regarde au plus 500 sessions, et
        `next` dit où commence la suivante.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 256 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: "Après `from`, 31 jours au plus.", schema: { type: string, format: date-time } }
        - { name: status, in: query, description: "Le statut effectif (une session échue est `expired`).", schema: { type: string } }
        - { name: protocol, in: query, schema: { type: string } }
        - { name: requestedBy, in: query, schema: { type: string } }
        - { name: privilegedAccountId, in: query, schema: { type: string } }
        - { name: breakGlass, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, description: "Le `next` de la page précédente.", schema: { type: string } }
      responses:
        "200":
          description: Une page
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [sessions, next]
                properties:
                  sessions: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Session" } }
                  next: { type: string, description: "Vide quand il n'y a plus rien." }
        "400":
          description: "`q` de 1, 2 ou plus de 256 caractères ; fenêtre absente, inversée ou de plus de 31 jours ; `breakGlass` ni `true` ni `false` ; `cursor` qui n'est pas celui d'une page."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Pas d'utilisateur authentifié.
        "503":
          description: L'Authorization Service ne répond pas, ou une lecture n'a pas pu être écrite dans l'audit ; rien n'est servi.

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Détail d'une session
      description: >
        Peut lire une session : **son demandeur**, sans politique ; **la
        personne qui l'a décidée** (approbation ou rejet), pour cette session ;
        ou une personne qui détient une politique RBAC sur la ressource
        `session-read:account:{targetAccountId}` (action `session:read`) —
        refusé par défaut, distincte de `vault:*`, de `breakglass:*`, de
        `breakglass-approve:*` et de `session-terminate:*` : aucun de ces
        pouvoirs ne donne le droit de lire (ADR-0019). Un approbateur qui n'est
        ni le demandeur ni le décideur est refusé ; il passe par la liste des
        demandes en attente (`GET /sessions?status=pending_approval`).

        La Gateway dit au Broker **qui** lit et avec quels rôles, à partir du
        jeton vérifié ; une requête ou un corps écrits par le client sont
        écartés. L'ordre des vérifications est : l'appelant est identifié
        (`403`), la session existe (`404`), l'appelant en a le droit (`403`,
        quel que soit l'état de la session). Le refus est le même pour tous :
        il ne contient ni le compte, ni le demandeur, ni la justification, ni
        l'état, ni la raison donnée par l'Authorization Service.

        Une lecture **servie à un titulaire de politique** est enregistrée
        **avant** d'être servie (ADR-0021) : événement `session.read`,
        `success=true`, ressource `session`, sous le nom de l'appelant
        vérifié, **sans budget** — chaque lecture en est un. Si l'événement
        ne peut pas être écrit (l'Audit Service ne répond pas), la lecture
        n'est **pas** servie : `503`, sans rien de la session. Une lecture
        servie **au demandeur** ou à **celui qui a décidé** la session
        n'écrit rien et ne dépend pas de l'audit : rien ne leur est divulgué
        qu'ils n'avaient. Un **refus** (`403` d'une personne sans droit) est,
        lui, écrit à l'audit (`session.read`, `success=false`, sous le nom de
        l'appelant vérifié — jamais celui du demandeur —, ressource
        `session`) **dans la limite d'un budget par identité** (ADR-0020) :
        une rafale `SESSION_READ_AUDIT_BURST` (10 par défaut), puis
        `SESSION_READ_AUDIT_RATE_PER_MINUTE` par minute (6 par défaut), par
        processus du Broker. Le refus est **le même** que l'événement ait été
        écrit ou non, et une panne de l'audit ne le change pas. Ni un `404`,
        ni un `503`, ni un appelant absent n'écrivent quoi que ce soit.
        Une lecture ne coûte rien au budget d'actions (ADR-0016) ; seule la
        limite par adresse s'applique. L'état d'une session échue est lu
        `expired` sans que l'enregistrement change.
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Pas de jeton valide.
        "403":
          description: >
            L'appelant n'est ni le demandeur, ni celui qui a décidé la session,
            ni titulaire d'une politique `session-read` sur son compte. Le
            message ne dit rien de la session. Le refus est audité
            (`session.read`, échec, au nom de l'appelant) dans la limite du
            budget par identité (ADR-0020) ; la réponse est la même que
            l'événement soit écrit ou non.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Session inconnue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Une dépendance (Authorization Service, base, **Audit Service**) ne
            répond pas : rien n'est servi — un tiers n'est jamais servi faute
            de réponse, ni sans que sa lecture ait pu être enregistrée
            (ADR-0021), et une base muette n'est pas « session inconnue » —
            et l'appel peut être renouvelé. Le demandeur et le décideur ne
            dépendent ni de l'Authorization Service ni de l'audit. La cause
            reste dans le journal du Broker.
    delete:
      tags: [sessions]
      summary: Termine une session active
      description: >
        Peut terminer une session : **son demandeur**, sans politique, ou une
        personne qui détient une politique RBAC sur la ressource
        `session-terminate:account:{targetAccountId}` — refusé par défaut,
        distincte de `vault:*`, de `breakglass:*` et de `breakglass-approve:*`
        (pouvoir approuver une urgence n'est pas pouvoir terminer une session)
        (ADR-0017). La Gateway dit au Broker **qui** appelle et avec quels
        rôles, à partir du jeton vérifié ; tout ce que le client écrirait dans
        un corps est écarté.

        L'ordre des vérifications est : la session existe (`404`), l'appelant
        en a le droit (`403`, quel que soit l'état de la session), la session
        est active (`409`). Un appelant sans droit apprend donc le même `403`
        pour une session active ou terminée. Le refus est audité
        (`session.terminate`, échec) **sous le nom de l'appelant** ; un succès
        l'est aussi, sous le nom de **celui qui a terminé** — pas du demandeur.
        Un `404` ou un `409` n'écrit aucun événement. Deux personnes qui
        terminent la même session en même temps : une seule réussit, l'autre
        reçoit `409`.

        **Terminer, c'est couper (ADR-0018).** Avant de changer l'état de la
        session, le Broker dit au SSH Proxy de la révoquer : ses connexions
        ouvertes sont fermées (l'opérateur lit « session ended because it was
        terminated. », sans savoir par qui), ses tickets non consommés sont
        jetés et rien ne peut plus être établi pour elle. Le `200` n'est
        renvoyé qu'une fois la session coupée. Si le proxy ne répond pas, ou si
        une connexion ne se ferme pas dans les 5 secondes, la réponse est `503`,
        **la session reste active** et la tentative est inscrite à l'audit
        (`session.terminate`, échec, sous le nom de l'appelant) ; le même appel,
        renouvelé, aboutit quand le proxy est revenu. Le proxy inscrit de son
        côté `session.revoked` pour chaque connexion coupée.

        **Limites connues.** Les octrois de portée du Vault ne sont pas révoqués
        (le proxy abandonne le jeton avec le ticket ; il est à usage unique et
        réservé à l'identité du proxy). Avec plusieurs instances du proxy SSH
        (ADR-0046), la session est révoquée chez toutes : une seule qui ne
        confirme pas, et la réponse est `503`, rien n'est terminé.

        **Débit par utilisateur (ADR-0016, ADR-0017).** Chaque appel coûte un
        jeton au seau d'actions de **l'utilisateur vérifié**, le même que
        `connect`, `approve` et `reject` (`SESSION_ACTION_BURST` d'un coup, de
        1 à 1000, défaut 10, puis `SESSION_ACTION_RATE_PER_MINUTE` par minute,
        de 1 à 600, défaut 6), pris avant que le Broker ne soit appelé : un
        refus répété n'écrit donc pas d'événement d'audit sans limite. La
        lecture (`GET`) et une méthode non permise ne coûtent rien.
      responses:
        "200":
          description: Session terminée — le statut est `terminated`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Pas de jeton valide.
        "403":
          description: >
            L'appelant n'est ni le demandeur ni titulaire d'une politique
            `session-terminate` sur ce compte. Audité (échec), sous son nom.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Session inconnue.
        "409":
          description: >
            La session n'est pas active (déjà terminée, expirée, refusée ou en
            attente d'approbation), ou quelqu'un l'a terminée avant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Débit (ADR-0016) : « too many session actions from this user (at
            most N at once, then one every X): retry in S s ». L'action n'a
            pas atteint le Broker ; réessayer après le délai.
          headers:
            Retry-After:
              description: Secondes à attendre avant qu'un jeton se reforme.
              schema: { type: integer, minimum: 1 }
        "503":
          description: >
            Une dépendance (Authorization Service, base, **SSH Proxy** — qui
            doit confirmer la coupure, ADR-0018) ne répond pas : rien n'a été
            terminé, la session reste active et l'appel peut être renouvelé.
            La cause reste dans le journal du Broker.

  /sessions/{sessionId}/connect:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      summary: Prépare une connexion SSH, VNC ou RDP
      description: >
        Ne retourne jamais de secret cible. SSH renvoie une adresse de proxy et un ticket à usage unique.
        VNC et RDP renvoient un chemin d'attachement WebSocket ; le ticket reste côté Gateway dans un cookie
        HttpOnly, SameSite=Strict et à usage unique, et n'est jamais exposé au navigateur (ADR-0071, ADR-0088).
        RDP n'est ouvert que si l'installation a mis `RDP_ENABLED=true` au Broker et au proxy écran
        (ADR-0088) : sinon `409`, avant qu'aucun scope Vault ne soit émis.

        Une session dont l'enregistrement n'est pas possible n'est pas
        établie (ADR-0008) : si le Command Recorder n'est pas prêt, le SSH
        Proxy refuse et la requête répond `503`. Aucune commande n'a été
        exécutée et aucun secret n'a été consommé ; la même requête peut
        être renouvelée une fois le recorder rétabli. L'événement d'audit
        `session.recording_unavailable` est émis.

        Seul le demandeur de la session peut se connecter (ADR-0011) : la
        Gateway dit au Broker qui appelle, à partir du jeton vérifié. Un autre
        utilisateur — l'approbateur d'une demande break-glass compris —
        reçoit `403`.

        **Débit par utilisateur (ADR-0016, ADR-0017).** Chaque appel de `connect`,
        `approve`, `reject` ou `DELETE /sessions/{sessionId}` coûte un jeton au seau d'actions de
        **l'utilisateur vérifié** (`SESSION_ACTION_BURST` d'un coup, de 1 à
        1000, défaut 10, puis `SESSION_ACTION_RATE_PER_MINUTE` par minute, de
        1 à 600, défaut 6) : un seul seau pour les quatre routes, distinct de
        celui de `POST /sessions`. Le jeton est pris avant que le Broker ne
        soit appelé : une action refusée ici n'atteint ni le Broker, ni le
        Vault, ni le proxy, et n'écrit aucun événement d'audit. Une méthode
        non permise ne coûte rien. La limite est par processus du Gateway.
      responses:
        "200":
          description: Ticket de connexion
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ConnectionTicket" }
                  - { $ref: "#/components/schemas/ScreenAttach" }
          headers:
            Set-Cookie:
              description: >
                Pour VNC et RDP uniquement : ob_screen_attach, HttpOnly, SameSite=Strict, limité au chemin
                /sessions/{sessionId}/screen et valable au plus 30 secondes. Le ticket proxy n'est
                pas présent dans le corps de la réponse.
              schema: { type: string }
        "403":
          description: L'appelant n'est pas le demandeur de la session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Débit (ADR-0016) : « too many session actions from this user (at
            most N at once, then one every X): retry in S s ». L'action n'a
            pas atteint le Broker ; réessayer après le délai.
          headers:
            Retry-After:
              description: Secondes à attendre avant qu'un jeton se reforme.
              schema: { type: integer, minimum: 1 }
        "404":
          description: Session inconnue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            La session ne peut pas être connectée dans son état (terminée,
            expirée, en attente…) — ou l'identité de sa cible n'est pas épinglée :
            clé SSH via PUT /vault/accounts/{id}/host-key (ADR-0039), empreinte
            TLS et nom de cible via PUT /vault/accounts/{id}/tls-pin (ADR-0071).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Enregistrement indisponible — ou une autre dépendance (Vault,
            proxy) qui ne répond pas (ADR-0042) : la session n'a pas été
            établie. Le corps ne dit pas la cause (elle est dans le journal du
            Broker). Distinct de `409` (la session n'est pas dans un état où
            elle peut être connectée) : ici l'état de la session est inchangé
            et l'appel peut être renouvelé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{sessionId}/approve:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      summary: Approuve une demande en attente
      description: >
        La demande passe de `pending_approval` à `active` ; la durée demandée
        court **à partir de l'approbation**. Sans corps : l'identité de
        l'approbateur et ses rôles sont ceux du jeton vérifié par la Gateway —
        tout ce que le client écrirait dans un corps est écarté.

        Pour une demande break-glass, l'approbateur détient une politique
        `breakglass-approve:account:{targetAccountId}` ; le break-glass doit
        toujours être activé et la durée rester dans sa limite. Pour une
        demande ordinaire d'un compte soumis à approbation (ADR-0067), il
        détient `session-approve:account:{targetAccountId}`. Dans les deux
        cas, une autre personne doit décider (comparaison d'identifiants),
        la demande doit être en attente et non périmée, et l'événement de
        décision est audité avant d'agir. L'audit inclut le ticket de la
        demande ordinaire dans les détails protégés par le hash v4 (ADR-0068).
        Si l'audit ne répond pas, la demande reste en attente.

        **Débit par utilisateur (ADR-0016, ADR-0017).** Chaque appel de `connect`,
        `approve`, `reject` ou `DELETE /sessions/{sessionId}` coûte un jeton au seau d'actions de
        **l'utilisateur vérifié** (`SESSION_ACTION_BURST` d'un coup, de 1 à
        1000, défaut 10, puis `SESSION_ACTION_RATE_PER_MINUTE` par minute, de
        1 à 600, défaut 6) : un seul seau pour les quatre routes, distinct de
        celui de `POST /sessions`. Le jeton est pris avant que le Broker ne
        soit appelé : une action refusée ici n'atteint ni le Broker, ni le
        Vault, ni le proxy, et n'écrit aucun événement d'audit. Une méthode
        non permise ne coûte rien. La limite est par processus du Gateway.
      responses:
        "200":
          description: Demande approuvée — la session est `active`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403":
          description: >
            Refusé : décision de sa propre demande, politique d'approbation
            absente, dérogation désactivée ou durée hors limite. Le refus est
            audité (`session.breakglass_approved` ou `session.approval_approved`, échec).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Débit (ADR-0016) : « too many session actions from this user (at
            most N at once, then one every X): retry in S s ». L'action n'a
            pas atteint le Broker ; réessayer après le délai.
          headers:
            Retry-After:
              description: Secondes à attendre avant qu'un jeton se reforme.
              schema: { type: integer, minimum: 1 }
        "404":
          description: Session inconnue.
        "409":
          description: >
            Pas une demande en attente : déjà décidée, périmée, ou pas une
            demande soumise à approbation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            Une dépendance (Authorization Service, audit, base) ne répond pas ;
            la décision n'a pas été prise et peut être renouvelée. La cause
            reste dans le journal du Broker, pas dans la réponse.

  /sessions/{sessionId}/reject:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      summary: Rejette une demande en attente
      description: >
        La demande passe à `denied` et ne pourra jamais être connectée. Même
        autorité que l'approbation (politique sur
        `breakglass-approve:account:{targetAccountId}`) : un tiers sans
        autorité ne peut pas tuer une demande d'urgence de quelqu'un d'autre.
        Pour une demande ordinaire, l'autorité est
        `session-approve:account:{targetAccountId}` (ADR-0067) ; le demandeur
        ne peut pas non plus rejeter sa propre demande. La décision est auditée
        (`session.breakglass_rejected` ou `session.approval_rejected`) et
        l'événement d'approbation ordinaire inclut le ticket protégé par hash v4.
        Mêmes réponses que `approve`.

        **Débit par utilisateur (ADR-0016, ADR-0017).** Chaque appel de `connect`,
        `approve`, `reject` ou `DELETE /sessions/{sessionId}` coûte un jeton au seau d'actions de
        **l'utilisateur vérifié** (`SESSION_ACTION_BURST` d'un coup, de 1 à
        1000, défaut 10, puis `SESSION_ACTION_RATE_PER_MINUTE` par minute, de
        1 à 600, défaut 6) : un seul seau pour les quatre routes, distinct de
        celui de `POST /sessions`. Le jeton est pris avant que le Broker ne
        soit appelé : une action refusée ici n'atteint ni le Broker, ni le
        Vault, ni le proxy, et n'écrit aucun événement d'audit. Une méthode
        non permise ne coûte rien. La limite est par processus du Gateway.
      responses:
        "200":
          description: Demande rejetée — le statut est `denied`, `decidedBy` dit qui.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { description: Politique d'approbation absente. Audité (échec). }
        "429":
          description: >
            Débit (ADR-0016) : « too many session actions from this user (at
            most N at once, then one every X): retry in S s ». L'action n'a
            pas atteint le Broker ; réessayer après le délai.
          headers:
            Retry-After:
              description: Secondes à attendre avant qu'un jeton se reforme.
              schema: { type: integer, minimum: 1 }
        "404": { description: Session inconnue. }
        "409": { description: Pas une demande en attente. }
        "503": { description: Une dépendance ne répond pas ; la décision n'a pas été prise. }

  /sessions/{sessionId}/screen:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Relais WebSocket du flux écran VNC
      description: >
        Upgrade WebSocket même origine, sous-protocole openbastion.screen.v1. Cette route utilise le
        cookie HttpOnly à usage unique posé par POST /sessions/{sessionId}/connect et n'accepte pas
        de bearer token ni de ticket dans l'URL. La Gateway consomme le cookie puis relaie le flux
        binaire vers le proxy sous mTLS ; le proxy n'envoie une frame qu'après son acquittement
        durable par Video Recorder (ADR-0071). Les frames sont limitées à 4 Mio et l'entrée à 16 octets.
      security: []
      responses:
        "101": { description: Connexion WebSocket établie ; le flux transporte HELLO, FRAME et END binaires }
        "401": { description: Cookie d'attachement absent, expiré ou déjà consommé }
        "403": { description: Origine WebSocket refusée }
        "503": { description: Le proxy graphique est indisponible }

  /sessions/{sessionId}/recording:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Récupère l'enregistrement texte (commandes) d'une session
      description: >
        Les commandes de la session, dans l'ordre où elles ont été
        enregistrées, paginées. Lisible pendant la session comme après.
        Réservé aux rôles autorisés par une politique
        `recording:session:read` sur `recording:session:{sessionId}` ; la
        Gateway transmet l'utilisateur et les rôles du jeton vérifié, jamais
        ceux que le client pourrait fournir. Chaque page servie est un
        événement d'audit `recording.read` (succès, ressource `session`,
        auteur = l'utilisateur authentifié), écrit **avant** d'être servi ;
        s'il ne s'écrit pas, la page n'est pas servie (503) — ADR-0022. Il
        n'y a pas de budget : chaque page lue est un événement. Un refus
        (403) est un événement `recording.read` en échec, sous le nom de
        l'appelant, dans la limite d'un budget par identité (ADR-0024 :
        `RECORDING_READ_AUDIT_BURST`, 10, puis
        `RECORDING_READ_AUDIT_RATE_PER_MINUTE`, 6 par minute) ; la réponse ne
        dépend jamais du budget ni de l'audit. Un identifiant qui ne peut pas
        être celui d'une session (vide, plus de 256 octets, pas UTF-8, un caractère de contrôle — ADR-0025) est un
        400, avant toute question et sans événement. Le refus (403) est le même que la session
        existe ou non, et une session sans commande enregistrée donne un
        enregistrement vide (200), pas un 404 : l'API ne permet pas de
        sonder quelles sessions existent.
        Chaque entrée est la commande telle que l'opérateur l'a saisie, pas
        telle que le shell de la cible l'a exécutée (historique et
        complétion ne sont pas reconstitués). Une ligne saisie à un prompt
        de secret (sudo, su, ssh…) apparaît sous la forme
        `[redacted: input at a secret prompt]`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Flux de commandes horodaté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandRecording" }
        "400":
          description: "L'identifiant ne peut pas être celui d'une session (ADR-0024)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Pas d'utilisateur authentifié, ou refusé par l'Authorization Service (refus audité dans la limite du budget, ADR-0024)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            L'Authorization Service ne répond pas (fermé par défaut), ou la
            lecture n'a pas pu être enregistrée dans l'audit : rien n'est
            servi, et la réponse ne dit rien de l'enregistrement ni de la
            panne (ADR-0022). La même lecture aboutit une fois la dépendance
            revenue.

  /sessions/{sessionId}/recording/video/segments/{firstSequence}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: firstSequence
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
        description: Première séquence du segment à relire.
    get:
      tags: [sessions]
      summary: Récupère un segment vidéo enregistré d'une session
      description: >
        Le Video Recorder vérifie l'action `recording:session:read` pour
        `recording:session:{sessionId}`, puis écrit `recording.read` à l'Audit
        Service avant de déchiffrer et de servir le segment (ADR-0070). La
        Gateway transmet exclusivement l'utilisateur et les rôles du jeton
        vérifié ; les paramètres, le corps et les en-têtes du client ne peuvent
        pas choisir cette identité. Les images sont renvoyées en base64 dans
        `frameData`. `complete: false` indique que l'enregistrement a été
        interrompu avant son marqueur terminal. Le stockage objet n'est jamais
        exposé directement et la réponse est marquée `Cache-Control: no-store`.
      responses:
        "200":
          description: Segment PNG horodaté et état de complétude.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoRecordingSegment" }
        "400":
          description: Identifiant de session ou séquence invalide.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Refus RBAC du Video Recorder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Segment inexistant ou non disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: État ou séquence de l'enregistrement incompatible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Réponse amont invalide ; aucun segment n'est servi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Le Video Recorder, l'autorisation ou l'audit est indisponible ; aucun octet n'est servi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /recordings/search:
    get:
      tags: [sessions]
      summary: Cherche un texte dans les commandes enregistrées (ADR-0080)
      description: >
        Le Command Recorder déchiffre à la volée les sessions dont
        l'enregistrement a commencé dans la fenêtre, et y cherche `q` comme
        sous-chaîne, sans tenir compte de la casse (Unicode, NFC). Aucun index,
        aucune copie en clair. Au plus 200 sessions par recherche (les plus
        récentes d'abord), 50 commandes par session et 1 000 au total ;
        au-delà, `truncated` est vrai et une fenêtre plus étroite trouve le
        reste. Chaque session est autorisée (`recording:session:read` sur
        `recording:session:{id}`) avant que rien d'elle ne soit déchiffré ;
        une session refusée n'apparaît pas. Un événement `recording.search`
        est écrit **avant** tout déchiffrement (détails : la fenêtre, les
        nombres de sessions candidates, autorisées et refusées, et une
        empreinte HMAC de `q`, jamais `q`) ; puis un `recording.read` par
        session dont la réponse montre des commandes (détail `search_id`).
        L'un d'eux non écrit : rien n'est servi (503). Désactivée sans
        `SEARCH_AUDIT_KEY_FILE` (404).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 256 }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: "Après `from`, 31 jours au plus."
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Les sessions dont la réponse montre des commandes
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingSearchResult" }
        "400":
          description: "`q` hors de 3 à 256 caractères, fenêtre absente, inversée ou de plus de 31 jours."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Pas d'utilisateur authentifié.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: La recherche n'est pas configurée (`SEARCH_AUDIT_KEY_FILE`).
        "503":
          description: >
            L'Authorization Service ne répond pas, ou la recherche ou l'une
            des lectures qu'elle divulgue n'a pas pu être écrite dans
            l'audit : rien n'est servi, et la réponse ne dit rien des
            enregistrements.

  /vault/accounts:
    get:
      tags: [vault]
      summary: Liste les comptes privilégiés
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page de comptes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/PrivilegedAccount" }
    post:
      tags: [vault]
      summary: Enregistre (onboard) un compte privilégié
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivilegedAccountInput" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivilegedAccount" }

        "400":
          description: hostKey SSH absente/illisible, protocole non pris en charge, ou rotation incompatible avec VNC/RDP.
        "403":
          description: Refusé par l'Authorization Service ; le corps dit pourquoi.
        "409":
          description: Un compte de cet identifiant, ou de ce nom sur cette cible, existe déjà — ou le compte de réconciliation n'est pas utilisable (ADR-0043, ADR-0037).
        "503":
          description: Une dépendance du Vault (Authorization Service, base) ne répond pas ; rien n'est enregistré. Le corps ne dit pas la cause (ADR-0043).

  /vault/accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [vault]
      summary: Détail d'un compte privilégié (métadonnées, jamais le secret)
      responses:
        "200":
          description: Compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivilegedAccount" }
        "404":
          description: "Compte introuvable ou désactivé (les deux cas ne sont volontairement pas distingués)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [vault]
      summary: Retire un compte du coffre-fort
      responses:
        "204":
          description: Compte supprimé
        "403":
          description: Refusé par l'Authorization Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Compte introuvable ou déjà supprimé. Même ordre que pour rotate : 403 avant 404."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /vault/accounts/{accountId}/host-key:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [vault]
      summary: Épingle (ou ré-épingle) la clé d'hôte de la cible du compte
      description: >-
        Réservé aux administrateurs du compte (vault:account-admin:{id}).
        Seule la clé vient du client ; l'auteur est celui du jeton vérifié,
        et le changement est écrit dans l'audit (vault.host_key_set) avant
        d'avoir lieu : sans audit, pas de changement. Celui qui change une
        clé décide du serveur qui recevra le secret : la relever sur la
        cible elle-même, jamais par le réseau qu'on veut protéger (ADR-0039).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostKey]
              properties:
                hostKey: { type: string, example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA…" }
      responses:
        "200":
          description: Clé épinglée
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostKeyFingerprint: { type: string, example: "SHA256:…" }
        "400":
          description: Ce n'est pas une clé publique SSH (vide, illisible, deux lignes, marqueur @revoked / @cert-authority)
        "403":
          description: L'appelant n'administre pas ce compte
        "404":
          description: Compte inconnu ou désactivé
        "503":
          description: L'Audit Service ne répond pas — aucun changement de clé sans trace

  /vault/accounts/{accountId}/tls-pin:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [vault]
      summary: Épingle (ou ré-épingle) le certificat TLS et le nom de cible d'un compte VNC/RDP
      description: >-
        Réservé aux administrateurs du compte (`vault:account-admin:{id}`).
        L'empreinte SHA-256 doit provenir du certificat feuille relevé sur la cible,
        jamais d'une connexion non fiable. L'audit (`vault.tls_pin_set`) est écrit
        avant le changement ; sans audit, aucune modification. Un compte VNC/RDP
        sans empreinte et nom DNS/IP épinglés ne peut recevoir de scope (ADR-0071).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tlsCertificateSha256, targetDomain]
              properties:
                tlsCertificateSha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$', description: Empreinte SHA-256 hexadécimale du certificat feuille }
                targetDomain: { type: string, description: Nom DNS ou IP attendu dans le certificat TLS }
      responses:
        "200":
          description: Identité TLS épinglée
          content:
            application/json:
              schema:
                type: object
                required: [tlsCertificateSha256, targetDomain]
                properties:
                  tlsCertificateSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                  targetDomain: { type: string }
        "400":
          description: Empreinte, nom de cible ou protocole invalide
        "403":
          description: L'appelant n'administre pas ce compte
        "404":
          description: Compte inconnu ou désactivé
        "409":
          description: Une dépendance de cible manque avant l'émission d'un scope
        "503":
          description: L'Audit Service ou une dépendance du Vault ne répond pas — aucun changement sans trace

  /vault/accounts/{accountId}/approval:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [vault]
      summary: Configure l'approbation des sessions d'un compte
      description: >
        Réservé à l'administrateur du compte. L'auteur et ses rôles viennent
        du jeton vérifié, jamais du corps. Les changements sont audités par
        le Vault avant d'être appliqués. La Gateway borne aussi ces écritures
        par identité (`VAULT_ACCOUNT_ACTION_BURST` et
        `VAULT_ACCOUNT_ACTION_RATE_PER_MINUTE`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalRequired]
              properties:
                approvalRequired: { type: boolean }
      responses:
        "200":
          description: Configuration mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalRequired: { type: boolean }
        "400": { description: Le corps ne contient pas un booléen approvalRequired. }
        "403": { description: L'appelant n'administre pas ce compte. }
        "404": { description: Compte inconnu ou désactivé. }
        "429":
          description: Le budget par utilisateur de modification de compte est épuisé ; réessayer après Retry-After.
          headers:
            Retry-After:
              description: Secondes avant le prochain jeton.
              schema: { type: integer, minimum: 1 }
        "503": { description: L'audit ou une dépendance du Vault ne répond pas ; aucun changement non audité n'est appliqué. }

  /vault/accounts/{accountId}/rotate:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [vault]
      summary: Déclenche une rotation manuelle immédiate
      description: >-
        Aucun corps de requête : un secret de 32 octets aléatoires est
        toujours généré automatiquement. Choix délibéré, pas une omission —
        l'API Gateway ne relaie jamais vers Password Vault un secret fourni
        par le client sur cette route (voir le handler Gateway de cette
        route), précisément pour qu'un opérateur ne puisse jamais connaître
        ni choisir la valeur recréée. Le contrat interne de Password Vault
        (service VaultAccountAdmin, RPC RotateSecret — docs/api/grpc/README.md §5) accepte
        techniquement un secret explicite optionnel, pensé pour un futur
        appelant interne programmatique (le Scheduler, docs/roadmap.md), pas pour
        cette surface publique, qui ne l'expose donc pas ici.
        Depuis ADR-0037, la rotation **change le mot de passe sur la cible**
        par le compte de réconciliation du compte, le vérifie, et seulement
        alors le rend courant ; la réponse vient une fois tout cela fait.
      responses:
        "202":
          description: Le nouveau secret est posé et vérifié sur la cible, et courant
        "409":
          description: Le compte n'a pas de compte de réconciliation utilisable, ou pas de clé d'hôte épinglée (ADR-0039), ou une rotation est déjà en cours
        "502":
          description: La cible a refusé le nouveau secret (rien n'a changé), ou il n'a pas pu être vérifié (gardé en attente, réglé à la rotation suivante)
        "503":
          description: L'Audit Service ne répond pas — aucune rotation sans trace
        "403":
          description: Refusé par l'Authorization Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Compte introuvable ou désactivé (les deux cas ne sont volontairement pas distingués). Le contrôle d'accès passe avant l'existence : un appelant non autorisé reçoit 403 que le compte existe ou non."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /policies:
    get:
      tags: [policies]
      summary: Liste les politiques RBAC
      responses:
        "200":
          description: Page de politiques
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Policy" }
    post:
      tags: [policies]
      summary: Crée une politique RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "201":
          description: Politique créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }

        "403":
          description: L'appelant ne peut pas créer de politique ; le corps dit pourquoi.
        "409":
          description: Une politique pour ce rôle, ce motif de ressource et cet effet existe déjà (ADR-0043).
        "503":
          description: Le magasin des politiques ne répond pas ; rien n'est créé. Le corps ne dit pas la cause (ADR-0043).

  /audit/events:
    get:
      tags: [audit]
      summary: Recherche dans le journal d'audit signé
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: actor
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Page d'événements d'audit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }

  /audit/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [audit]
      summary: Détail d'un événement d'audit, avec sa signature
      responses:
        "200":
          description: Événement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "SESSION_DENIED" }
        message: { type: string }
        traceId: { type: string }

    PagedResponse:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }

    MFAChallenge:
      type: object
      description: ADR-0062 — le mot de passe était bon, un second facteur est exigé
      required: [mfa, challenge, expiresIn]
      properties:
        mfa: { type: string, enum: [required, enrollment_required] }
        challenge: { type: string, description: À usage limité (5 essais), valable expiresIn secondes }
        expiresIn: { type: integer, example: 300 }
        factors:
          type: array
          description: >
            ADR-0065 — pour `required`, les facteurs que le compte détient et que ses rôles admettent ;
            pour `enrollment_required`, ceux qu'il peut enrôler. Un rôle strict
            (`MFA_PHISHING_RESISTANT_ROLES`) n'admet que `webauthn`.
          items: { type: string, enum: [totp, webauthn] }
        webauthn: { type: object, description: Les options de `navigator.credentials.get`, quand le compte a une clé }
    MFACodeRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
    IdentityProviderInfo:
      description: Ce que la page de connexion sait d'un fournisseur ou d'un annuaire (ADR-0076)
      type: object
      required: [id, label]
      properties:
        id: { type: string, description: "`[a-z0-9-]{1,32}`, ou vide pour celui des variables `OIDC_*`/`LDAP_*`" }
        label: { type: string, description: "Le libellé déclaré ; vide pour celui des variables" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: "secondes" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        identitySource: { type: string, enum: [local, oidc] }
        roles:
          type: array
          items: { type: string }

    SessionStatus:
      type: string
      enum: [pending_approval, active, expired, terminated, denied]

    SessionRequest:
      type: object
      required: [targetAccountId, protocol, justification]
      properties:
        targetAccountId: { type: string, format: uuid, description: "Réfère un PrivilegedAccount du Vault" }
        protocol:
          type: string
          enum: [ssh, vnc, rdp]
          description: Must match the stored account protocol. An RDP session is connectable only where the installation set RDP_ENABLED=true at the Broker and at the screen proxy (ADR-0088); otherwise connect answers 409.
        justification: { type: string, minLength: 10 }
        durationMinutes: { type: integer, default: 60, maximum: 480 }
        breakGlass:
          type: boolean
          default: false
          description: >
            Demande la dérogation d'urgence à l'enregistrement (ADR-0009). Pour
            une session break-glass, `durationMinutes` est borné par la limite
            de la plateforme (30 minutes par exemple), pas par 480. La demande
            attend l'approbation d'une autre personne (ADR-0011) sauf si la
            plateforme a désactivé la double validation par son nom. Refusé
            (`409`) pour un compte `rdp` ou `vnc` (ADR-0071 §8).
        ticket:
          type: string
          maxLength: 128
          description: >
            Référence obligatoire si le compte cible exige une approbation
            (ADR-0067), validée par APPROVAL_TICKET_PATTERN ; ignorée sinon.
            N'y placez aucun secret. Les demandes refusées pour ticket invalide
            sont auditées sans conserver ni répéter sa valeur.

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SessionStatus" }
        protocol: { type: string }
        targetHost: { type: string }
        requestedBy: { type: string, format: uuid }
        justification: { type: string }
        breakGlass:
          type: boolean
          description: >
            La session a été autorisée à s'exécuter sans le Command Recorder.
            Cela dit ce qu'elle PEUT faire, pas ce qu'elle a fait : la
            dérogation n'a réellement servi que si l'audit porte
            `session.breakglass` pour cette session.
        approvalRequired:
          type: boolean
          description: Le compte exige une approbation (ADR-0067).
        ticket:
          type: string
          description: Référence de la demande d'approbation (ADR-0067).
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: >
            Fin de la session. Tant que le statut est `pending_approval`, c'est
            l'**échéance de la décision** : passée, la demande est `expired`
            (lecture paresseuse) et ne peut plus être décidée.
        decidedBy:
          type: string
          format: uuid
          description: >
            Qui a approuvé ou rejeté une demande break-glass (ADR-0011) ; absent
            pour toute session qui n'a pas fait l'objet d'une décision.
        decidedAt: { type: string, format: date-time }

    ConnectionTicket:
      type: object
      required: [proxyEndpoint, ticket, expiresAt]
      properties:
        protocol: { type: string, enum: [ssh], default: ssh }
        proxyEndpoint: { type: string, example: "ssh-proxy.internal:2222" }
        ticket: { type: string, description: "Jeton à usage unique, consommé par le SSH Proxy" }
        expiresAt: { type: string, format: date-time }

    ScreenAttach:
      type: object
      required: [protocol, attach, expiresAt]
      properties:
        protocol: { type: string, enum: [vnc, rdp] }
        attach: { type: string, example: "/sessions/session-id/screen", description: "Chemin WebSocket même origine ; l'authentification est le cookie HttpOnly d'attachement, pas le bearer token" }
        expiresAt: { type: string, format: date-time }

    CommandRecording:
      type: object
      properties:
        sessionId: { type: string }
        page: { type: integer, description: "Page réellement servie (la page demandée, ramenée à 1 si < 1)" }
        pageSize: { type: integer, description: "Taille réellement servie (défaut 20, maximum 100)" }
        totalEntries: { type: integer, description: "Nombre total de commandes enregistrées pour la session" }
        entries:
          type: array
          items:
            type: object
            properties:
              timestamp: { type: string, format: date-time }
              command: { type: string }

    RecordingSearchResult:
      type: object
      required: [searchId, sessions, truncated]
      properties:
        searchId: { type: string, description: "L'identifiant de la recherche, celui de son événement `recording.search`" }
        truncated: { type: boolean, description: "Plus de 200 sessions dans la fenêtre, ou plus de 1 000 commandes trouvées" }
        sessions:
          type: array
          items:
            type: object
            required: [sessionId, hits]
            properties:
              sessionId: { type: string }
              hits:
                type: array
                maxItems: 50
                items:
                  type: object
                  properties:
                    timestamp: { type: string, format: date-time }
                    command: { type: string }

    VideoRecordingSegment:
      type: object
      required: [sessionId, firstSequence, lastSequence, frames, complete]
      properties:
        sessionId: { type: string }
        firstSequence: { type: integer, format: int64, minimum: 1 }
        lastSequence: { type: integer, format: int64, minimum: 1 }
        complete:
          type: boolean
          description: Faux si la session s'est interrompue sans marqueur terminal.
        frames:
          type: array
          items: { $ref: "#/components/schemas/VideoRecordingFrame" }

    VideoRecordingFrame:
      type: object
      required: [timestamp, frameData, codec]
      properties:
        timestamp: { type: string, format: date-time }
        frameData:
          type: string
          format: byte
          description: Image PNG encodée en base64 ; taille brute maximale de 4 Mio par segment.
        codec: { type: string, enum: [png] }

    PrivilegedAccountInput:
      type: object
      required: [name, username, targetHost, protocol]
      properties:
        name: { type: string }
        username: { type: string, description: "Compte sur la cible — distinct de name, qui identifie l'enregistrement (docs/architecture/data-architecture.md §3)." }
        targetHost: { type: string }
        protocol: { type: string, enum: [ssh, vnc, rdp] }
        rotationPolicy: { type: string, enum: [manual, post_use, scheduled], default: post_use, description: "Rotation automatique disponible uniquement pour SSH : post_use après une session (ADR-0037) ou scheduled tous les rotationIntervalDays jours (ADR-0040). VNC/RDP exigent manual." }
        reconciliationAccountId: { type: string, description: "Compte du Vault, de la même cible, qui peut changer ce mot de passe (root ou sudo chpasswd) — ADR-0037 ; vide : pas de rotation ; obligatoire pour scheduled (409 sinon)" }
        rotationIntervalDays: { type: integer, minimum: 1, maximum: 365, description: "Obligatoire pour rotationPolicy scheduled, refusé pour les autres (400) — ADR-0040. Le Vault fait tourner le compte cet intervalle après sa dernière rotation (ou sa création)." }
        hostKey: { type: string, example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA…", description: "Obligatoire pour SSH ; vide pour VNC/RDP, qui exigent ensuite PUT /vault/accounts/{accountId}/tls-pin (ADR-0071). Pour SSH : clé d'hôte publique relevée sur la cible ou ligne known_hosts (ADR-0039), ou autorité @cert-authority (ADR-0048), avec lignes @revoked possibles (ADR-0054)." }

    PrivilegedAccount:
      allOf:
        - $ref: "#/components/schemas/PrivilegedAccountInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            approvalRequired:
              type: boolean
              description: Toute session ordinaire sur ce compte attend une seconde personne (ADR-0067).
            lastRotatedAt: { type: string, format: date-time }
            rotationOwedSince: { type: string, format: date-time, description: "Une session s'est terminée et le compte doit une rotation (ADR-0044) ; absent : il ne doit rien. Le Vault la paie, et la réessaie tant qu'il n'y arrive pas." }
            rotationFailures: { type: integer, description: "Rotations planifiées échouées d'affilée (ADR-0041) ; absent à 0. Tous les ROTATION_ALERT_AFTER_FAILURES échecs, vault.rotation_overdue est écrit à l'audit." }
            nextRotationAt: { type: string, format: date-time, description: "Compte scheduled seulement : quand il sera échu (ADR-0040). Le Vault balaie toutes les ROTATION_SWEEP_SECONDS : la rotation a lieu au premier balayage qui suit." }
            hostKeyFingerprint: { type: string, example: "SHA256:yghJebhOfPlVqBTuLQp+13ACAaCo+e5vLM/jNp6sJso", description: "Empreinte de hostKey (celle de l'autorité pour une ligne @cert-authority, ADR-0048) ; vide pour un compte enregistré avant ADR-0039 et jamais épinglé, qui n'ouvre aucune session" }
            tlsCertificateSha256: { type: string, pattern: '^[a-f0-9]{64}$', description: "Empreinte SHA-256 du certificat TLS feuille épinglé (ADR-0071), vide avant pinning" }
            targetDomain: { type: string, description: "Nom DNS/IP vérifié dans le certificat TLS (ADR-0071), vide avant pinning" }
            createdAt: { type: string, format: date-time }
            disabledAt: { type: string, format: date-time, description: "Absent tant que le compte est actif. Posé par DELETE /vault/accounts/{id} (suppression logique — docs/architecture/data-architecture.md §3) ; un compte avec ce champ renseigné n'apparaît plus dans GET /vault/accounts et GET /vault/accounts/{id} répond 404." }

    PolicyInput:
      type: object
      required: [name, role, resourcePattern, effect]
      properties:
        name: { type: string }
        role: { type: string }
        resourcePattern: { type: string, example: "vault:account:prod-*" }
        effect: { type: string, enum: [allow, deny] }

    Policy:
      allOf:
        - $ref: "#/components/schemas/PolicyInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        action:
          type: string
          example: "session.connect"
          description: >
            Famille `ressource.verbe`. Pour les sessions : `session.connect`,
            `session.terminate`, et — politique d'enregistrement obligatoire,
            ADR-0008 — `session.recording_unavailable` (session refusée à
            l'admission, recorder non prêt) et `session.recording_lost`
            (session terminée en cours de route parce qu'une commande n'a pas
            pu être enregistrée ; la commande n'a pas été exécutée). Ces deux
            événements portent `result = failure`.

            Break-glass (ADR-0009) : `session.breakglass_requested` (Broker :
            demande mise en attente, accordée ou refusée), `session.breakglass_approved`
            et `session.breakglass_rejected` (Broker, ADR-0011 : la décision de la
            seconde personne, émise **avant** d'agir ; `result = failure` pour un
            refus — soi-même, politique absente), `session.breakglass` (proxy : la
            dérogation a réellement servi — émis avant la récupération du
            credential, et sa défaillance refuse la session) et, pour toute
            session, `session.expire` (le proxy a coupé la session à
            l'échéance — une fin normale, `result = success`).
        resourceType: { type: string }
        resourceId: { type: string }
        details:
          type: object
          maxProperties: 16
          propertyNames:
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9_.]+$"
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
          description: >
            Métadonnées UTF-8 sans caractère de contrôle, protégées par le hash v4
            (ADR-0068). Au plus 16 entrées ; clés de 1 à 64 octets en a-z, 0-9,
            _ ou . ; valeurs de 1 à 256 octets. Les événements d'approbation
            portent le ticket ici. Une map vide est permise.
        result: { type: string, enum: [success, failure] }
        signature: { type: string, description: "Signature de l'événement, base64" }
