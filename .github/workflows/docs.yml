name: Documentation

# Porte automatique du site : conformité des pages, liens internes, puis
# construction statique (VitePress échoue lui aussi sur un lien mort), et
# publication du site construit sur GitHub Pages depuis `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Pages, liens et construction
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte (voir ADR-0047), jamais par étiquette.
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier la conformité des pages Markdown
        run: npm run docs:check:markdown
      - name: Vérifier les liens internes
        run: npm run docs:check:links
      - name: Construire le site
        run: npm run docs:build

  dco:
    name: Vérification DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer les commits de la pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier le sign-off de chaque commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+> GitHub Pages continuait de rendre
  # le README.md du dépôt (source « branche main, racine ») au lieu du site
  # VitePress. La source Pages doit être « GitHub Actions » dans les réglages
  # du dépôt (Settings → Pages → Source).
  deploiement:
    name: Publication sur GitHub Pages
    needs: verification
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    # Les publications ne s'annulent pas entre elles : un déploiement interrompu
    # en cours de route laisserait le site dans un état incohérent.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run docs:build
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - name: Déployer le site
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
; then
              echo "::error::Commit $commit sans trailer DCO Signed-off-by valide"
              failed=1
            fi
          done < <(git rev-list --reverse "$BASE_SHA..HEAD")
          if [ "$failed" -ne 0 ]; then
            echo "Chaque commit doit porter son propre trailer Signed-off-by. Utilisez git commit -s."
            exit 1
          fi
          echo "Tous les commits de la pull request portent un trailer DCO valide."

  # Publication réelle du site : sans ce job, GitHub Pages continuait de rendre
  # le README.md du dépôt (source « branche main, racine ») au lieu du site
  # VitePress. La source Pages doit être « GitHub Actions » dans les réglages
  # du dépôt (Settings → Pages → Source).
  deploiement:
    name: Publication sur GitHub Pages
    needs: verification
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    # Les publications ne s'annulent pas entre elles : un déploiement interrompu
    # en cours de route laisserait le site dans un état incohérent.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run docs:build
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - name: Déployer le site
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
